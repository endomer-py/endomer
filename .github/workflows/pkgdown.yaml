name: Bilingual pkgdown
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified static site to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: endomer
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: endomer
          extra-packages: any::pkgdown, any::jsonlite, any::roxygen2
          needs: website
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install beautifulsoup4
      - run: Rscript endomer/scripts/build-docs.R
      - run: python endomer/scripts/check-sites.py artifacts/endomer-engih-release/sites/r --kind r
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/endomer-engih-release/sites/r
  deploy:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
